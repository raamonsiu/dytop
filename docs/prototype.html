<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ambient // player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #f2f4ef;
    --ink-dim: rgba(242,244,239,0.62);
    --ink-faint: rgba(242,244,239,0.32);
    --glass: rgba(14,16,13,0.46);
    --glass-strong: rgba(10,12,9,0.72);
    --glass-border: rgba(242,244,239,0.14);
    --accent: #c8e06a;
    --accent-dim: rgba(200,224,106,0.28);
    --danger: #e0806a;
    --radius: 14px;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:var(--sans);
    color:var(--ink);
    background:#0a0b09;
  }

  /* ---------- BACKGROUND LAYERS ---------- */
  #bg-layer{
    position:fixed; inset:0; z-index:0;
    overflow:hidden;
    background:#0a0b09;
  }
  #bg-layer img, #bg-layer video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.1s ease;
  }
  #bg-layer img.active, #bg-layer video.active{ opacity:1; }

  #bg-scrim{
    position:fixed; inset:0; z-index:1;
    background:linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.0) 70%, rgba(0,0,0,0.35) 100%);
    pointer-events:none;
  }

  #empty-bg-hint{
    position:fixed; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
    text-align:center;
    color:var(--ink-faint);
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.02em;
    pointer-events:none;
  }
  #empty-bg-hint .big{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:0.18em;
  }

  /* ---------- YT HIDDEN PLAYER ---------- */
  #yt-mount{
    position:fixed;
    width:1px; height:1px;
    top:-9999px; left:-9999px;
    opacity:0;
    pointer-events:none;
  }

  /* ---------- TOP HOVER ZONE (reveals navbar) ---------- */
  #hover-zone{
    position:fixed; top:0; left:0; right:0; height:26px;
    z-index:40;
  }

  /* ---------- NAVBAR ---------- */
  #navbar{
    position:fixed; top:0; left:0; right:0;
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:10px 14px;
    transform:translateY(-120%);
    opacity:0;
    transition:transform 0.55s cubic-bezier(.22,1,.36,1), opacity 0.45s ease;
    pointer-events:none;
  }
  #navbar.visible{
    transform:translateY(0);
    opacity:1;
    pointer-events:auto;
  }

  #navbar-inner{
    display:flex;
    align-items:center;
    gap:2px;
    background:rgba(10,12,9,0.55);
    backdrop-filter:blur(16px) saturate(130%);
    -webkit-backdrop-filter:blur(16px) saturate(130%);
    border:1px solid rgba(242,244,239,0.1);
    border-radius:8px;
    padding:4px;
    box-shadow:0 8px 28px rgba(0,0,0,0.3);
  }

  .nav-divider{
    width:1px; height:16px;
    background:rgba(242,244,239,0.1);
    margin:0 3px;
    flex-shrink:0;
  }

  .nav-btn{
    display:flex; align-items:center; gap:6px;
    background:transparent;
    border:none;
    color:var(--ink-faint);
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:0.01em;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
    white-space:nowrap;
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.07); color:var(--ink-dim); }
  .nav-btn.active{ background:var(--accent-dim); color:var(--accent); }
  .nav-btn svg{ width:13px; height:13px; flex-shrink:0; }
  .nav-btn .badge{
    background:var(--accent);
    color:#111;
    font-size:9px;
    font-weight:700;
    padding:1px 5px;
    border-radius:4px;
    line-height:1.4;
  }

  /* ---------- PERSISTENT BOTTOM-RIGHT PLAYER HUD ---------- */
  /* Unlike the navbar, this never hides — it's the always-on now-playing
     readout, deliberately terminal/monospace in feel. */
  #player-hud{
    position:fixed; bottom:18px; right:18px;
    z-index:45;
    display:flex; align-items:center; gap:10px;
    background:rgba(10,12,9,0.5);
    backdrop-filter:blur(14px) saturate(130%);
    -webkit-backdrop-filter:blur(14px) saturate(130%);
    border:1px solid rgba(242,244,239,0.09);
    border-radius:8px;
    padding:8px 10px;
    max-width:min(92vw, 380px);
  }
  #hud-transport{
    display:flex; align-items:center; gap:2px;
    flex-shrink:0;
  }
  #hud-info{
    min-width:0;
    flex:1;
    line-height:1.3;
  }
  #hud-title{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #hud-artist{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #hud-time{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    background:rgba(255,255,255,0.05);
    border:none;
    border-radius:5px;
    padding:6px 8px;
    cursor:pointer;
    flex-shrink:0;
    transition:background 0.15s ease, color 0.15s ease;
    white-space:nowrap;
  }
  #hud-time:hover{ background:rgba(255,255,255,0.1); color:var(--ink); }

  @media (max-width: 640px){
    #player-hud{ left:12px; right:12px; max-width:none; }
    #hud-artist{ display:none; }
  }
  .transport-btn{
    background:none; border:none; color:var(--ink);
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    cursor:pointer;
    transition:background 0.2s ease;
    flex-shrink:0;
  }
  .transport-btn:hover{ background:rgba(255,255,255,0.12); }
  .transport-btn svg{ width:14px; height:14px; }
  #play-pause-btn svg{ width:16px; height:16px; }

  /* ---------- PANELS (dropdowns) ---------- */
  .panel-anchor{ position:relative; }
  .panel{
    position:absolute; top:calc(100% + 12px); left:50%;
    transform:translateX(-50%) translateY(-6px);
    min-width:320px;
    background:var(--glass-strong);
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    padding:16px;
    opacity:0; visibility:hidden;
    transition:opacity 0.22s ease, transform 0.22s ease, visibility 0.22s;
    z-index:60;
  }
  .panel.open{
    opacity:1; visibility:visible;
    transform:translateX(-50%) translateY(0);
  }
  /* ---------- LYRICS DELAY HOVER PANEL ---------- */
  /* Distinct from .panel: opens on hover (not click), smaller, and sits
     near the lyrics button aligned to the navbar edge. */
  #lyrics-anchor{ position:relative; }
  .hover-panel{
    position:absolute; top:calc(100% + 10px); right:0;
    background:var(--glass-strong);
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid var(--glass-border);
    border-radius:10px;
    box-shadow:0 16px 44px rgba(0,0,0,0.4);
    padding:10px 12px;
    opacity:0; visibility:hidden;
    transform:translateY(-4px);
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    z-index:60;
    pointer-events:none;
    white-space:nowrap;
  }
  #lyrics-anchor:hover .hover-panel,
  .hover-panel.pinned-open{
    opacity:1; visibility:visible;
    transform:translateY(0);
    pointer-events:auto;
  }
  .lyrics-delay-msg{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-faint);
    text-align:center;
    margin-bottom:8px;
  }
  .lyrics-delay-controls{
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .lyrics-delay-btn{
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.07);
    border:none;
    border-radius:7px;
    color:var(--ink);
    font-family:var(--mono);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .lyrics-delay-btn:hover{ background:rgba(255,255,255,0.15); }
  .lyrics-delay-value{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink);
    min-width:52px;
    text-align:center;
  }

  .panel-title{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--ink-faint);
    margin:0 0 12px 0;
    display:flex; align-items:center; justify-content:space-between;
  }

  /* Background panel */
  .bg-options{ display:flex; flex-direction:column; gap:8px; }
  .bg-option-row{ display:flex; gap:8px; }
  .file-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:rgba(255,255,255,0.05);
    border:1px dashed var(--glass-border);
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:12px;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .file-btn:hover{ background:rgba(255,255,255,0.09); border-color:var(--ink-faint); color:var(--ink); }
  .file-input{ display:none; }

  #bg-thumbs{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
    margin-top:12px;
    max-height:180px;
    overflow-y:auto;
  }
  .bg-thumb{
    position:relative;
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    border:2px solid transparent;
    background:rgba(255,255,255,0.05);
  }
  .bg-thumb.selected{ border-color:var(--accent); }
  .bg-thumb img, .bg-thumb video{ width:100%; height:100%; object-fit:cover; }
  .bg-thumb .thumb-remove{
    position:absolute; top:2px; right:2px;
    width:16px; height:16px;
    background:rgba(0,0,0,0.65);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
    font-size:10px;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .bg-thumb:hover .thumb-remove{ opacity:1; }
  .bg-thumb .thumb-kind{
    position:absolute; bottom:2px; left:3px;
    font-family:var(--mono); font-size:8px;
    color:rgba(255,255,255,0.75);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 2px;
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink-dim);
  }
  .switch{
    width:34px; height:19px;
    background:rgba(255,255,255,0.14);
    border-radius:999px;
    position:relative;
    cursor:pointer;
    transition:background 0.2s ease;
    flex-shrink:0;
  }
  .switch.on{ background:var(--accent); }
  .switch::after{
    content:'';
    position:absolute; top:2px; left:2px;
    width:15px; height:15px;
    background:#f2f4ef;
    border-radius:50%;
    transition:transform 0.2s ease;
  }
  .switch.on::after{ transform:translateX(15px); background:#0d0f0b; }

  /* ---------- BACKGROUND MODE: 3-way segmented control ---------- */
  .bg-mode-row{ margin-top:6px; }
  .bg-mode-label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    margin-bottom:8px;
  }
  .segmented-control{
    display:flex;
    background:rgba(255,255,255,0.05);
    border-radius:9px;
    padding:3px;
    gap:2px;
  }
  .segmented-option{
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink-faint);
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.01em;
    padding:8px 4px;
    border-radius:7px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
    white-space:nowrap;
  }
  .segmented-option:hover{ color:var(--ink-dim); }
  .segmented-option.active{ background:var(--accent-dim); color:var(--accent); }

  /* Add-song panel */
  #url-input-row{ display:flex; gap:8px; }
  #yt-url-input{
    flex:1;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--glass-border);
    border-radius:10px;
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    padding:11px 12px;
    outline:none;
    transition:border-color 0.2s ease;
  }
  #yt-url-input::placeholder{ color:var(--ink-faint); }
  #yt-url-input:focus{ border-color:var(--accent); }
  #add-song-btn{
    background:var(--accent);
    color:#12140f;
    border:none;
    border-radius:10px;
    padding:0 16px;
    font-family:var(--mono);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:filter 0.15s ease;
  }
  #add-song-btn:hover{ filter:brightness(1.08); }
  #add-song-feedback{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    margin-top:8px;
    min-height:14px;
  }
  #add-song-feedback.error{ color:var(--danger); }
  #add-song-feedback.ok{ color:var(--accent); }

  /* Queue panel */
  #queue-panel{ min-width:340px; }
  .queue-section-label{
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--ink-faint);
    padding:10px 4px 6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .queue-section-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--glass-border);
  }
  .queue-section-label:first-child{ padding-top:2px; }

  .queue-item.history{ background:rgba(224,128,106,0.12); }
  .queue-item.history:hover{ background:rgba(224,128,106,0.2); }
  .queue-item.now-playing{ background:rgba(200,224,106,0.16); }
  .queue-item.now-playing:hover{ background:rgba(200,224,106,0.24); }
  .queue-item.upcoming{ background:rgba(106,166,224,0.14); }
  .queue-item.upcoming:hover{ background:rgba(106,166,224,0.22); }

  #queue-list{
    display:flex; flex-direction:column;
    gap:2px;
    max-height:280px;
    overflow-y:auto;
    margin:0 -6px;
  }
  #queue-list::-webkit-scrollbar, #bg-thumbs::-webkit-scrollbar{ width:6px; }
  #queue-list::-webkit-scrollbar-thumb, #bg-thumbs::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); border-radius:3px; }

  .queue-item{
    display:flex; align-items:center; gap:10px;
    padding:8px 6px;
    border-radius:8px;
    cursor:grab;
    transition:background 0.15s ease;
  }
  .queue-item:hover{ background:rgba(255,255,255,0.06); }
  .queue-item.playing{ background:var(--accent-dim); }
  .queue-item.dragging{ opacity:0.4; }
  .queue-thumb{
    width:36px; height:36px; border-radius:6px;
    object-fit:cover; flex-shrink:0;
    background:rgba(255,255,255,0.08);
  }
  .queue-info{ flex:1; min-width:0; }
  .queue-title{
    font-size:12.5px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .queue-meta{
    font-family:var(--mono); font-size:10px; color:var(--ink-faint);
    margin-top:2px;
  }
  .queue-remove{
    background:none; border:none; color:var(--ink-faint);
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    transition:all 0.15s ease;
  }
  .queue-remove:hover{ color:var(--danger); background:rgba(224,128,106,0.14); }
  #queue-empty{
    text-align:center; padding:28px 12px;
    color:var(--ink-faint);
    font-family:var(--mono); font-size:12px;
    line-height:1.6;
  }

  /* ---------- LYRICS OVERLAY ---------- */
  #lyrics-layer{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    padding:0 12%;
    pointer-events:none;
    opacity:0;
    overflow:hidden;
    transition:opacity 0.6s ease;
  }
  #lyrics-layer.visible{ opacity:1; }

  /* Fixed-height viewport window: only ~5 lines are ever visible.
     #lyrics-box is the scrolling track inside it, moved with transform
     so we have exact control instead of relying on scrollIntoView. */
  #lyrics-viewport{
    width:100%; max-width:900px;
    height:min(60vh, 420px);
    overflow:hidden;
    position:relative;
    mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
  }
  #lyrics-box{
    text-align:center;
    position:absolute;
    left:0; right:0; top:50%;
    transition:transform 0.5s cubic-bezier(.22,1,.36,1);
    will-change:transform;
  }
  .lyric-line{
    font-family:'DynaPuff', var(--sans);
    font-weight:600;
    font-size:clamp(20px, 3.4vw, 42px);
    line-height:1.35;
    color:var(--ink-faint);
    transition:color 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
    opacity:0.4;
    transform:scale(0.96);
    margin:6px 0;
  }
  .lyric-line.current{
    color:var(--ink);
    opacity:1;
    transform:scale(1);
    text-shadow:0 4px 30px rgba(0,0,0,0.5);
  }
  .lyric-line.past{ opacity:0.22; }
  #lyrics-status{
    font-family:var(--mono); font-size:12px;
    color:var(--ink-faint);
    letter-spacing:0.05em;
  }

  /* ---------- PERIMETER PROGRESS (clock-style, traces the viewport edge) ---------- */
  #progress-perimeter{
    position:fixed; inset:0;
    z-index:30;
    pointer-events:none;
    width:100%; height:100%;
  }
  #progress-perimeter-track{
    fill:none;
    stroke:rgba(255,255,255,0.06);
    stroke-width:3;
    vector-effect:non-scaling-stroke;
  }
  #progress-perimeter-fill{
    fill:none;
    stroke:var(--accent);
    stroke-width:3;
    vector-effect:non-scaling-stroke;
    filter:drop-shadow(0 0 4px var(--accent));
    /* No CSS transition here on purpose: dashoffset is driven every frame
       by requestAnimationFrame in JS (see animateProgressTo), which gives
       consistent, symmetric motion on both sides of the ring. A CSS
       transition running in parallel with 300ms-interval JS updates was
       causing uneven, stuttery motion on one side. */
  }

  /* ---------- HIDE-ALL BUTTON ---------- */
  #btn-hide-all{
    position:fixed; top:16px; right:16px;
    z-index:70; /* above navbar and HUD so it's always reachable */
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,12,9,0.5);
    backdrop-filter:blur(14px) saturate(130%);
    -webkit-backdrop-filter:blur(14px) saturate(130%);
    border:1px solid rgba(242,244,239,0.1);
    border-radius:8px;
    color:var(--ink-dim);
    cursor:pointer;
    transition:opacity 0.4s ease, background 0.15s ease, color 0.15s ease;
  }
  #btn-hide-all svg{ width:16px; height:16px; }
  #btn-hide-all:hover{ background:rgba(255,255,255,0.1); color:var(--ink); }

  /* Interface shown (default): button always visible. */
  /* Interface partially/fully hidden: button fades to invisible, only
     reappears on hover over its corner — keeps the clean view clean
     until the user reaches for it. */
  body.ui-hidden-all #btn-hide-all,
  body.ui-hidden-partial #btn-hide-all{ opacity:0; }
  body.ui-hidden-all #btn-hide-all:hover,
  body.ui-hidden-all #btn-hide-all:focus-visible,
  body.ui-hidden-partial #btn-hide-all:hover,
  body.ui-hidden-partial #btn-hide-all:focus-visible{ opacity:1; }

  /* State 2 (hidden-all): navbar + HUD + progress ring all disappear. */
  body.ui-hidden-all #navbar,
  body.ui-hidden-all #player-hud,
  body.ui-hidden-all #progress-perimeter{
    opacity:0 !important;
    pointer-events:none !important;
  }
  /* State 3 (hidden-partial): navbar + HUD disappear, progress ring stays. */
  body.ui-hidden-partial #navbar,
  body.ui-hidden-partial #player-hud{
    opacity:0 !important;
    pointer-events:none !important;
  }
  body.ui-hidden-all #player-hud,
  body.ui-hidden-partial #player-hud{ transform:scale(0.98) translateY(6px); }

<script>
/* ============================================================
   AMBIENT PLAYER — single-file prototype
   Sections: IndexedDB store, Background manager, Queue manager,
   YouTube controller, Lyrics engine, Navbar/UI wiring.
   ============================================================ */

(() => {
'use strict';

/* ---------------------------------------------------------
   0. Tiny IndexedDB wrapper (stores uploaded bg files as blobs)
--------------------------------------------------------- */
const DB_NAME = 'ambient-player-db';
const DB_VERSION = 1;
const STORE_BG = 'backgrounds';
const STORE_QUEUE = 'queue';
const STORE_STATE = 'state';

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE_BG)) db.createObjectStore(STORE_BG, { keyPath:'id' });
      if(!db.objectStoreNames.contains(STORE_QUEUE)) db.createObjectStore(STORE_QUEUE, { keyPath:'id' });
      if(!db.objectStoreNames.contains(STORE_STATE)) db.createObjectStore(STORE_STATE, { keyPath:'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

let dbPromise = openDB().catch(err => { console.error('IndexedDB unavailable', err); return null; });

async function idbPut(storeName, value){
  const db = await dbPromise;
  if(!db) return;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDelete(storeName, key){
  const db = await dbPromise;
  if(!db) return;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetAll(storeName){
  const db = await dbPromise;
  if(!db) return [];
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(storeName, key){
  const db = await dbPromise;
  if(!db) return undefined;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------------------------------------------------------
   0c. Accent color extraction from the active background
   Images: sample pixels on an offscreen canvas, pick the most vivid
   (highest saturation*lightness-weighted) color rather than a flat
   average, so a photo dominated by a dull sky/wall doesn't wash out
   into gray. Videos: extracting per-frame would mean constant
   recalculation for something that's always changing anyway, so we
   fall back to one fixed, pleasant accent instead.
--------------------------------------------------------- */
const VIDEO_FALLBACK_ACCENT = { r:200, g:224, b:106 }; // default/fallback accent (used before first sample, on extraction errors, or when there's no background at all)

function rgbToHsl(r, g, b){
  r/=255; g/=255; b/=255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if(max === min){ h = s = 0; }
  else{
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch(max){
      case r: h = (g-b)/d + (g<b?6:0); break;
      case g: h = (b-r)/d + 2; break;
      case b: h = (r-g)/d + 4; break;
    }
    h /= 6;
  }
  return [h, s, l];
}

function extractDominantColor(imgEl){
  return new Promise((resolve) => {
    try{
      const canvas = document.createElement('canvas');
      const SIZE = 48;
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d', { willReadFrequently:true });
      ctx.drawImage(imgEl, 0, 0, SIZE, SIZE);
      const { data } = ctx.getImageData(0, 0, SIZE, SIZE);
      let bestScore = -1, best = VIDEO_FALLBACK_ACCENT;
      for(let i = 0; i < data.length; i += 4){
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        if(a < 200) continue; // skip transparent pixels
        const [, s, l] = rgbToHsl(r, g, b);
        // favor saturated, mid-lightness pixels — avoids picking near-black
        // shadows or near-white blown highlights as "the" accent
        const lightnessScore = 1 - Math.abs(l - 0.55) * 1.6;
        const score = s * Math.max(lightnessScore, 0.05);
        if(score > bestScore){ bestScore = score; best = { r, g, b }; }
      }
      resolve(best);
    } catch(err){
      console.warn('[accent] color extraction failed (likely a CORS-tainted canvas):', err);
      resolve(VIDEO_FALLBACK_ACCENT);
    }
  });
}

let currentAccentRgb = { r:200, g:224, b:106 };
let accentTransitionRAF = null;

function applyAccentColor({ r, g, b }, { animate = true } = {}){
  // clamp lightness so the accent stays usable as text/glow color even if
  // the extracted hue was very dark or very pale
  const [h, s] = rgbToHsl(r, g, b);
  const safeS = Math.max(s, 0.45);
  const safeL = 0.62;
  const hslToRgb = (h, s, l) => {
    const k = n => (n + h*12) % 12;
    const a = s * Math.min(l, 1-l);
    const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
  };
  const [nr, ng, nb] = hslToRgb(h, safeS, safeL);
  const target = { r:nr, g:ng, b:nb };

  if(!animate){
    currentAccentRgb = target;
    setAccentCssVars(target);
    return;
  }
  animateAccentTo(target);
}

function setAccentCssVars({ r, g, b }){
  document.documentElement.style.setProperty('--accent', `rgb(${r},${g},${b})`);
  document.documentElement.style.setProperty('--accent-dim', `rgba(${r},${g},${b},0.28)`);
}

function animateAccentTo(target, durationMs = 400){
  const start = { ...currentAccentRgb };
  const startTime = performance.now();
  if(accentTransitionRAF) cancelAnimationFrame(accentTransitionRAF);

  function step(now){
    const t = Math.min((now - startTime) / durationMs, 1);
    // ease-out for a gentle settle rather than a linear color snap
    const eased = 1 - Math.pow(1 - t, 2);
    const r = Math.round(start.r + (target.r - start.r) * eased);
    const g = Math.round(start.g + (target.g - start.g) * eased);
    const b = Math.round(start.b + (target.b - start.b) * eased);
    currentAccentRgb = { r, g, b };
    setAccentCssVars(currentAccentRgb);
    if(t < 1) accentTransitionRAF = requestAnimationFrame(step);
    else accentTransitionRAF = null;
  }
  accentTransitionRAF = requestAnimationFrame(step);
}

/* Live re-sampling: re-reads the current frame every SAMPLE_INTERVAL_MS
   while a video background is active, so the accent drifts along with
   what's on screen. Images only need to be sampled once (they don't
   change), so the interval is only ever running for videos. */
const ACCENT_SAMPLE_INTERVAL_MS = 400;
let accentSampleTimer = null;

function stopAccentSampling(){
  clearInterval(accentSampleTimer);
  accentSampleTimer = null;
}

function startAccentSamplingForVideo(videoEl){
  stopAccentSampling();
  accentSampleTimer = setInterval(async () => {
    if(videoEl.paused || videoEl.readyState < 2) return; // not enough data to sample yet
    const color = await extractDominantColor(videoEl);
    applyAccentColor(color);
  }, ACCENT_SAMPLE_INTERVAL_MS);
}

async function updateAccentFromBackground(mediaEl, kind){
  if(kind === 'video'){
    // first sample immediately so the accent isn't stuck at the default
    // while waiting for the first interval tick, then keep resampling
    // every ACCENT_SAMPLE_INTERVAL_MS for as long as this video is active
    const color = await extractDominantColor(mediaEl);
    applyAccentColor(color);
    startAccentSamplingForVideo(mediaEl);
    return;
  }
  stopAccentSampling(); // switching to a static image: no need to keep resampling
  const color = await extractDominantColor(mediaEl);
  applyAccentColor(color);
}


/* ---------------------------------------------------------
   0b. Perimeter progress geometry
   The progress ring traces the viewport's edge like a clock: it starts
   at the top-center, splits and travels both ways along the top edge,
   down both sides, and meets again at the bottom-center when the song
   ends. We achieve the "start at top-center" look with a rect whose
   path normally starts at the top-left corner, by offsetting the dash
   pattern by exactly half the top edge's length.
--------------------------------------------------------- */
/*
  Geometry recap: an SVG <rect> path starts at top-left and travels
  clockwise: top edge (L->R), right edge, bottom edge (R->L), left edge,
  back to top-left. Path-position 0 = top-left corner；
  path-position `topHalfLength` = top-center.

  Goal: one solid arc, centered on top-center, that grows symmetrically
  in both directions as the ratio increases, wrapping fully around to
  meet at bottom-center at ratio=1.

  Implementation: stroke-dasharray = [filled, perimeter-filled] draws a
  single dash of length `filled` starting at path-position 0, then a gap
  for the rest. stroke-dashoffset shifts where that dash starts along
  the path. To make the dash of length `filled` centered on
  `topHalfLength`, it must start at `topHalfLength - filled/2`.
  dashoffset achieves "start at position X" via dashoffset = -X (verified
  numerically against a from-scratch path-painting simulation).
*/
let perimeterLength = 0;
let topHalfLength = 0;

function resizePerimeter(){
  const w = window.innerWidth, h = window.innerHeight;
  const inset = 1.5; // half the stroke width, so the stroke sits flush on the edge
  const innerW = Math.max(0, w - inset*2);
  const innerH = Math.max(0, h - inset*2);
  [progressTrack, progressFillRect].forEach(rect => {
    rect.setAttribute('x', inset);
    rect.setAttribute('y', inset);
    rect.setAttribute('width', innerW);
    rect.setAttribute('height', innerH);
  });
  progressSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  perimeterLength = 2 * (innerW + innerH);
  topHalfLength = innerW / 2;

  // track: full outline, always fully visible, no dash pattern needed
  progressTrack.style.strokeDasharray = `${perimeterLength}`;
  progressTrack.style.strokeDashoffset = '0';

  setPerimeterProgress(lastProgressRatio || 0);
}

let lastProgressRatio = 0;
function setPerimeterProgress(ratio){
  lastProgressRatio = Math.min(Math.max(ratio, 0), 1);
  if(!perimeterLength) return;

  const filled = perimeterLength * lastProgressRatio;
  const halfWidth = filled / 2;
  const startPos = topHalfLength - halfWidth;

  progressFillRect.style.strokeDasharray = `${filled} ${perimeterLength - filled}`;
  progressFillRect.style.strokeDashoffset = `${-startPos}`;
}

// Smoothly animates from the current ratio to a new target ratio over
// the given duration, driven by requestAnimationFrame so both sides of
// the ring move at an identical, consistent rate every frame — this
// replaces relying on a CSS transition, which produced stuttery motion
// on one side when racing against the 300ms polling interval.
let progressAnimRAF = null;
function animateProgressTo(targetRatio, durationMs = 320){
  const startRatio = lastProgressRatio;
  const startTime = performance.now();
  if(progressAnimRAF) cancelAnimationFrame(progressAnimRAF);

  function step(now){
    const t = Math.min((now - startTime) / durationMs, 1);
    const ratio = startRatio + (targetRatio - startRatio) * t;
    setPerimeterProgress(ratio);
    if(t < 1) progressAnimRAF = requestAnimationFrame(step);
    else progressAnimRAF = null;
  }
  progressAnimRAF = requestAnimationFrame(step);
}

window.addEventListener('resize', resizePerimeter);



/* ---------------------------------------------------------
   1. DOM refs
--------------------------------------------------------- */
const $ = (sel) => document.querySelector(sel);

const btnBg = $('#btn-bg'), panelBg = $('#panel-bg');

const bgFileInput = $('#bg-file-input');

const prevBtn = $('#prev-btn'), nextBtn = $('#next-btn'), playPauseBtn = $('#play-pause-btn');
const iconPlay = $('#icon-play'), iconPause = $('#icon-pause');

/* ---------------------------------------------------------
   2. Navbar show/hide logic
--------------------------------------------------------- */
let navVisible = false;
let hideTimer = null;
let anyPanelOpen = () => [panelBg, panelAdd, panelQueue].some(p => p.classList.contains('open'));

function showNav(){
  navVisible = true;
  navbar.classList.add('visible');
  clearTimeout(hideTimer);
}
function scheduleHide(delay = 1800){
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if(anyPanelOpen()) { scheduleHide(delay); return; }
    navVisible = false;
    navbar.classList.remove('visible');
  }, delay);
}

hoverZone.addEventListener('mouseenter', showNav);
navbar.addEventListener('mouseenter', showNav);
navbar.addEventListener('mouseleave', () => scheduleHide(900));
hoverZone.addEventListener('mouseleave', () => { if(!anyPanelOpen()) scheduleHide(1200); });

// also reveal briefly on any mouse movement near top, and on touch tap
document.addEventListener('mousemove', (e) => {
  if(e.clientY < 90) showNav();
});
document.addEventListener('touchstart', (e) => {
  if(e.touches[0].clientY < 90) { showNav(); scheduleHide(2600); }
});

/* ---------------------------------------------------------
   2b. Hide-all toggle — 3-state cycle:
   'visible' -> 'hidden-all' (navbar + HUD + progress ring all gone)
             -> 'hidden-partial' (navbar + HUD gone, progress ring stays)
             -> back to 'visible'
--------------------------------------------------------- */
const UI_STATES = ['visible', 'hidden-all', 'hidden-partial'];
let uiState = 'visible';

function setUiState(state){
  uiState = state;
  document.body.classList.remove('ui-hidden-all', 'ui-hidden-partial');
  if(state === 'hidden-all') document.body.classList.add('ui-hidden-all');
  else if(state === 'hidden-partial') document.body.classList.add('ui-hidden-partial');

  iconEyeOpen.style.display = state === 'visible' ? 'block' : 'none';
  iconEyeClosed.style.display = state === 'hidden-all' ? 'block' : 'none';
  iconEyeClosedPartial.style.display = state === 'hidden-partial' ? 'block' : 'none';

  const titles = {
    'visible': 'Ocultar interfaz',
    'hidden-all': 'Ocultar todo excepto el progreso',
    'hidden-partial': 'Mostrar interfaz',
  };
  btnHideAll.title = titles[state];

  if(state !== 'visible'){
    closeAllPanels();
    clearTimeout(hideTimer);
  }
}

/* ---------------------------------------------------------
   4. Background manager
--------------------------------------------------------- */
const bgState = {
  items: [],       // {id, kind:'image'|'video', blob, objectUrl}
  activeId: null,
  mode: 'fixed',   // 'fixed' | 'random' | 'on-song-end'
  randomTimer: null,
};

function isVideoFile(file){ return file.type.startsWith('video/'); }
function isImageFile(file){ return file.type.startsWith('image/'); } // includes gif

async function loadBackgroundsFromDB(){
  const rows = await idbGetAll(STORE_BG);
  bgState.items = rows.map(r => ({
    id: r.id, kind: r.kind, blob: r.blob, objectUrl: URL.createObjectURL(r.blob)
  }));
  const stateRow = await idbGet(STORE_STATE, 'bg-settings');
  if(stateRow){
    // migrate old boolean randomMode data if present from a previous version
    bgState.mode = stateRow.mode || (stateRow.randomMode ? 'random' : 'fixed');
    bgState.activeId = stateRow.activeId || null;
  }
  renderBgThumbs();
  applyActiveBackground();
  if(bgState.mode === 'random') startRandomRotation();
  updateBgModeControl();
}

async function persistBgSettings(){
  await idbPut(STORE_STATE, { key:'bg-settings', mode: bgState.mode, activeId: bgState.activeId });
}

function updateBgModeControl(){
  document.querySelectorAll('.segmented-option').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === bgState.mode);
  });
}

function renderBgThumbs(){
  bgThumbs.innerHTML = '';
  if(bgState.items.length === 0) return;
  bgState.items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'bg-thumb' + (item.id === bgState.activeId ? ' selected' : '');
    const media = item.kind === 'video'
      ? Object.assign(document.createElement('video'), { src:item.objectUrl, muted:true, loop:true, playsInline:true })
      : Object.assign(document.createElement('img'), { src:item.objectUrl });
    div.appendChild(media);
    const kindLabel = document.createElement('div');
    kindLabel.className = 'thumb-kind';
    kindLabel.textContent = item.kind === 'video' ? 'video' : (item.blob.type === 'image/gif' ? 'gif' : 'img');
    div.appendChild(kindLabel);
    const removeBtn = document.createElement('div');
    removeBtn.className = 'thumb-remove';
    removeBtn.textContent = '\u2715';
    removeBtn.addEventListener('click', (e) => { e.stopPropagation(); removeBackground(item.id); });
    div.appendChild(removeBtn);
    div.addEventListener('click', () => {
      // manually picking a background only makes sense as a "fixed"
      // choice — switch mode to fixed so it doesn't immediately get
      // rotated away or swapped on the next song change
      bgState.mode = 'fixed';
      updateBgModeControl();
      setActiveBackground(item.id);
      persistBgSettings();
      stopRandomRotation();
    });
    if(item.kind === 'video') media.play().catch(()=>{});
    bgThumbs.appendChild(div);
  });
}

function setActiveBackground(id){
  bgState.activeId = id;
  renderBgThumbs();
  applyActiveBackground();
}

function applyActiveBackground(){
  const item = bgState.items.find(i => i.id === bgState.activeId) || bgState.items[0];
  emptyBgHint.style.display = bgState.items.length === 0 ? 'flex' : 'none';
  if(!item){ bgLayer.innerHTML = ''; stopAccentSampling(); applyAccentColor(VIDEO_FALLBACK_ACCENT); return; }
  if(!bgState.activeId) bgState.activeId = item.id;

  let el;
  if(item.kind === 'video'){
    el = document.createElement('video');
    el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true;
    el.addEventListener('loadeddata', () => {
      el.classList.add('active');
      el.play().catch(err => console.warn('[bg] video play() blocked:', err));
      updateAccentFromBackground(el, 'video');
    });
    el.addEventListener('error', () => {
      console.error('[bg] video failed to load. blob type:', item.blob.type, 'size:', item.blob.size);
    });
  } else {
    el = document.createElement('img');
    el.crossOrigin = 'anonymous';
    el.addEventListener('load', () => {
      el.classList.add('active');
      updateAccentFromBackground(el, 'image');
    });
    el.addEventListener('error', () => {
      console.error('[bg] image failed to load. blob type:', item.blob.type, 'size:', item.blob.size);
    });
  }
  el.src = item.objectUrl;

  // swap only after the new element is in the DOM, remove old ones after transition
  const previous = [...bgLayer.children];
  bgLayer.appendChild(el);
  previous.forEach(old => old.remove());
}

async function addBackgroundFiles(fileList){
  const files = Array.from(fileList);
  for(const file of files){
    if(!isVideoFile(file) && !isImageFile(file)) continue;
    const id = uid();
    const kind = isVideoFile(file) ? 'video' : 'image';
    await idbPut(STORE_BG, { id, kind, blob: file });
    bgState.items.push({ id, kind, blob:file, objectUrl:URL.createObjectURL(file) });
  }
  renderBgThumbs();
  if(!bgState.activeId && bgState.items.length){
    setActiveBackground(bgState.items[0].id);
    persistBgSettings();
  }
}

async function removeBackground(id){
  await idbDelete(STORE_BG, id);
  const wasActive = bgState.activeId === id;
  bgState.items = bgState.items.filter(i => i.id !== id);
  if(wasActive){
    bgState.activeId = bgState.items.length ? bgState.items[0].id : null;
    applyActiveBackground();
    persistBgSettings();
  }
  renderBgThumbs();
}

function pickRandomBackground(){
  const pool = bgState.items.filter(i => i.id !== bgState.activeId);
  if(!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  setActiveBackground(pick.id);
  persistBgSettings();
}

function startRandomRotation(){
  stopRandomRotation();
  if(bgState.items.length < 2) return;
  bgState.randomTimer = setInterval(pickRandomBackground, 45000); // rotate every 45s
}
function stopRandomRotation(){
  clearInterval(bgState.randomTimer);
  bgState.randomTimer = null;
}

// Called whenever the "now playing" song changes (new song started,
// restarted, or skipped) — only acts if mode is 'on-song-end'.
function maybeChangeBackgroundOnSongChange(){
  if(bgState.mode !== 'on-song-end') return;
  if(bgState.items.length < 2) return;
  pickRandomBackground();
}

btnUploadBg.addEventListener('click', () => bgFileInput.click());
bgFileInput.addEventListener('change', (e) => {
  if(e.target.files && e.target.files.length) addBackgroundFiles(e.target.files);
  e.target.value = '';
});

document.querySelectorAll('.segmented-option').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const mode = btn.dataset.mode;
    bgState.mode = mode;
    updateBgModeControl();
    persistBgSettings();
    if(mode === 'random') startRandomRotation();
    else stopRandomRotation();
  });
});

panelBg.addEventListener('dragover', (e) => e.preventDefault());
panelBg.addEventListener('drop', (e) => {

  if(e.dataTransfer.files && e.dataTransfer.files.length) addBackgroundFiles(e.dataTransfer.files);
});

/* ---------------------------------------------------------
   5. YouTube URL parsing
--------------------------------------------------------- */
function extractYouTubeId(url){
  try{
    const u = new URL(url.trim());
    if(u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
    if(u.hostname.includes('youtube.com')){
      if(u.pathname === '/watch') return u.searchParams.get('v');
      if(u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
      if(u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
    }
  } catch(err){ return null; }
  return null;
}

/* ---------------------------------------------------------
   6. Queue manager
   Model: three separate lists instead of one array + index.
   - history: already-played songs (capped at HISTORY_LIMIT, oldest drop off)
   - nowPlaying: the single song currently loaded (or null)
   - upcoming: songs waiting to play next
--------------------------------------------------------- */
const HISTORY_LIMIT = 30;
const queueState = {
  history: [],      // [{id, videoId, title, ...}] most-recent last
  nowPlaying: null,
  upcoming: [],
};

function parseTitleGuess(rawTitle){
  // Heuristic: "Artist - Title" or "Artist: Title" or "Title (Official Video)" etc.
  let t = rawTitle
    .replace(/\(.*?(official|video|audio|lyrics?|visualizer|mv|hd|4k).*?\)/gi, '')
    .replace(/\[.*?(official|video|audio|lyrics?|visualizer|mv|hd|4k).*?\]/gi, '')
    .trim();
  const sepMatch = t.split(/\s-\s|\s–\s|\s—\s/);
  if(sepMatch.length >= 2){
    return { artist: sepMatch[0].trim(), title: sepMatch.slice(1).join(' - ').trim() };
  }
  return { artist: '', title: t };
}

async function fetchVideoMeta(videoId){
  // oEmbed doesn't require API key
  try{
    const res = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(`https://www.youtube.com/watch?v=${videoId}`)}&format=json`);
    if(!res.ok) throw new Error(`oEmbed HTTP ${res.status}`);
    const data = await res.json();
    return { title: data.title, author: data.author_name, thumb: data.thumbnail_url };
  } catch(err){
    console.error('[queue] oEmbed fetch failed for', videoId, '\u2192', err);
    return { title: `Video ${videoId}`, author: '', thumb: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg` };
  }
}

async function addSongToQueue(url){
  const videoId = extractYouTubeId(url);
  if(!videoId){
    setAddFeedback('URL de YouTube inv\u00e1lida.', 'error');
    return;
  }
  setAddFeedback('Buscando informaci\u00f3n del video\u2026', '');
  const meta = await fetchVideoMeta(videoId);
  const guess = parseTitleGuess(meta.title);
  const item = {
    id: uid(),
    videoId,
    title: meta.title,
    author: meta.author,
    thumb: meta.thumb,
    artistGuess: guess.artist || meta.author,
    titleGuess: guess.title,
  };
  queueState.upcoming.push(item);
  await idbPut(STORE_QUEUE, item);
  renderQueue();
  setAddFeedback(`Agregada: ${meta.title}`, 'ok');
  ytUrlInput.value = '';
  if(!queueState.nowPlaying) playNext();
}

function setAddFeedback(msg, kind){
  addSongFeedback.textContent = msg;
  addSongFeedback.className = kind || '';
}

async function loadQueueFromDB(){
  const rows = await idbGetAll(STORE_QUEUE);
  // rows are stored flat with a `bucket` tag so they survive reloads
  queueState.history = rows.filter(r => r.bucket === 'history').sort((a,b) => (a.order||0) - (b.order||0));
  queueState.upcoming = rows.filter(r => r.bucket === 'upcoming' || !r.bucket).sort((a,b) => (a.order||0) - (b.order||0));
  const nowPlayingRows = rows.filter(r => r.bucket === 'nowPlaying');
  queueState.nowPlaying = nowPlayingRows[0] || null;
  renderQueue();
}

async function persistQueueState(){
  // rewrite all (simple approach for prototype scale): tag each item with
  // its bucket + order so reloads can reconstruct the three lists.
  const db = await dbPromise;
  if(!db) return;
  const tx = db.transaction(STORE_QUEUE, 'readwrite');
  const store = tx.objectStore(STORE_QUEUE);
  store.clear();
  queueState.history.forEach((it, i) => store.put({ ...it, bucket:'history', order:i }));
  if(queueState.nowPlaying) store.put({ ...queueState.nowPlaying, bucket:'nowPlaying', order:0 });
  queueState.upcoming.forEach((it, i) => store.put({ ...it, bucket:'upcoming', order:i }));
}

function pushToHistory(item){
  if(!item) return;
  queueState.history.push(item);
  if(queueState.history.length > HISTORY_LIMIT){
    queueState.history.splice(0, queueState.history.length - HISTORY_LIMIT);
  }
}

function scrollQueueToNowPlaying(){
  const row = queueList.querySelector('.queue-item.now-playing');
  if(!row) return;
  // center the now-playing row inside the queue-list viewport, regardless
  // of how many "recently played" rows sit above it
  const target = row.offsetTop - (queueList.clientHeight / 2) + (row.offsetHeight / 2);
  queueList.scrollTop = Math.max(0, target);
}

function renderQueue(){
  const totalCount = queueState.upcoming.length;
  queueBadge.style.display = totalCount ? 'inline-block' : 'none';
  queueBadge.textContent = totalCount;
  queueCountLabel.textContent = totalCount ? `${totalCount} en cola` : '';

  queueList.innerHTML = '';

  const isEmpty = queueState.history.length === 0 && !queueState.nowPlaying && queueState.upcoming.length === 0;
  if(isEmpty){
    const empty = document.createElement('div');
    empty.id = 'queue-empty';
    empty.textContent = 'Todav\u00eda no hay nada. Agreg\u00e1 una URL de YouTube desde "Agregar".';
    queueList.appendChild(empty);
    return;
  }

  function addSectionLabel(text){
    const label = document.createElement('div');
    label.className = 'queue-section-label';
    label.textContent = text;
    queueList.appendChild(label);
  }

  function makeRow(item, kind, opts = {}){
    const row = document.createElement('div');
    row.className = `queue-item ${kind}`;
    row.draggable = !!opts.draggable;
    if(opts.idx !== undefined) row.dataset.idx = opts.idx;

    const img = document.createElement('img');
    img.className = 'queue-thumb';
    img.src = item.thumb;

    const info = document.createElement('div');
    info.className = 'queue-info';
    const titleEl = document.createElement('div');
    titleEl.className = 'queue-title';
    titleEl.textContent = item.title;
    const metaEl = document.createElement('div');
    metaEl.className = 'queue-meta';
    metaEl.textContent = opts.metaText || '';
    info.appendChild(titleEl); info.appendChild(metaEl);

    row.appendChild(img); row.appendChild(info);

    if(opts.removable){
      const removeBtn = document.createElement('button');
      removeBtn.className = 'queue-remove';
      removeBtn.innerHTML = '\u2715';
      removeBtn.addEventListener('click', (e) => { e.stopPropagation(); opts.onRemove(); });
      row.appendChild(removeBtn);
    }

    row.addEventListener('dblclick', () => opts.onDblClick && opts.onDblClick());
    if(opts.onDragStart){
      row.addEventListener('dragstart', opts.onDragStart);
      row.addEventListener('dragend', opts.onDragEnd);
      row.addEventListener('dragover', opts.onDragOver);
    }
    return row;
  }

  // ---- Recently played (oldest -> newest, ends just above "now playing") ----
  if(queueState.history.length){
    addSectionLabel('Reproducidas recientemente');
    queueState.history.forEach((item, idx) => {
      const distanceFromNow = queueState.history.length - idx; // #1 = most recent
      const row = makeRow(item, 'history', {
        metaText: `#-${distanceFromNow}`,
        onDblClick: () => jumpToHistoryItem(idx),
      });
      queueList.appendChild(row);
    });
  }

  // ---- Now playing ----
  addSectionLabel('Reproduciendo');
  if(queueState.nowPlaying){
    const row = makeRow(queueState.nowPlaying, 'now-playing', {
      metaText: '#0 \u2022 reiniciar',
      onDblClick: () => restartCurrentSong(),
    });
    queueList.appendChild(row);
  } else {
    const emptyNow = document.createElement('div');
    emptyNow.className = 'queue-meta';
    emptyNow.style.padding = '4px 8px 10px';
    emptyNow.textContent = 'Nada reproduci\u00e9ndose todav\u00eda.';
    queueList.appendChild(emptyNow);
  }

  // ---- Upcoming queue ----
  if(queueState.upcoming.length){
    addSectionLabel('Cola');
    queueState.upcoming.forEach((item, idx) => {
      const row = makeRow(item, 'upcoming', {
        idx,
        metaText: `#+${idx+1}`,
        draggable: true,
        removable: true,
        onRemove: () => removeFromUpcoming(idx),
        onDblClick: () => jumpToUpcomingItem(idx),
        onDragStart: () => row.classList.add('dragging'),
        onDragEnd: () => row.classList.remove('dragging'),
        onDragOver: (e) => {
          e.preventDefault();
          const dragging = queueList.querySelector('.dragging');
          if(!dragging || dragging === row) return;
          const rows = [...queueList.querySelectorAll('.queue-item.upcoming')];
          const draggingIdx = rows.indexOf(dragging);
          const targetIdx = rows.indexOf(row);
          if(draggingIdx < targetIdx) row.after(dragging); else row.before(dragging);
        },
      });
      queueList.appendChild(row);
    });
  }

  queueList.ondrop = () => {
    const domOrderTitles = [...queueList.querySelectorAll('.queue-item.upcoming .queue-title')].map(t => t.textContent);
    const newItems = [];
    const used = new Set();
    domOrderTitles.forEach(title => {
      const found = queueState.upcoming.find((it, i) => it.title === title && !used.has(i));
      if(found){ newItems.push(found); used.add(queueState.upcoming.indexOf(found)); }
    });
    if(newItems.length === queueState.upcoming.length){
      queueState.upcoming = newItems;
      renderQueue();
      persistQueueState();
    }
  };
}

async function removeFromUpcoming(idx){
  const item = queueState.upcoming[idx];
  queueState.upcoming.splice(idx, 1);
  renderQueue();
  persistQueueState();
}

function restartCurrentSong(){
  // double-click on the currently playing row: just restart it from 0,
  // don't touch history or upcoming at all.
  if(!queueState.nowPlaying || !ytReady) return;
  try{ ytPlayer.seekTo(0, true); ytPlayer.playVideo(); }
  catch(err){ console.error('[yt] restart failed:', err); }
  maybeChangeBackgroundOnSongChange();
}

function jumpToUpcomingItem(idx){
  // double-click on a queued (upcoming) row: it becomes now-playing.
  // the previous now-playing (if any) graduates to history, same as a
  // normal "next" — songs skipped over in upcoming are NOT touched, they
  // stay in the queue in their same relative order.
  const item = queueState.upcoming[idx];
  if(!item) return;
  queueState.upcoming.splice(idx, 1);
  if(queueState.nowPlaying) pushToHistory(queueState.nowPlaying);
  startPlaying(item);
}

function jumpToHistoryItem(idx){
  // double-click on an already-played row: it becomes now-playing again.
  // it's removed from history; the previous now-playing (if any) graduates
  // to history in its place.
  const item = queueState.history[idx];
  if(!item) return;
  queueState.history.splice(idx, 1);
  if(queueState.nowPlaying) pushToHistory(queueState.nowPlaying);
  startPlaying(item);
}

/* ---------------------------------------------------------
   7. YouTube IFrame Player controller (audio only, hidden)
--------------------------------------------------------- */
let ytPlayer = null;
let ytReady = false;
let isPlaying = false;
let progressInterval = null;

function loadYTApi(){
  return new Promise((resolve) => {
    if(window.YT && window.YT.Player){ resolve(); return; }
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = () => resolve();
  });
}

async function initYTPlayer(){
  await loadYTApi();
  const isFileProtocol = window.location.protocol === 'file:';
  const playerVars = { autoplay:0, controls:0, disablekb:1, modestbranding:1, playsinline:1 };
  if(!isFileProtocol){
    // YouTube's IFrame API rejects/mishandles origin=file://, so only send it
    // when we're actually served over http(s).
    playerVars.origin = window.location.origin;
  } else {
    console.warn('[yt] running from file:// — origin param omitted. For full reliability, serve this over http(s) (e.g. `python3 -m http.server`) instead of double-clicking the file.');
  }
  ytPlayer = new YT.Player('yt-mount', {
    height: '1', width: '1',
    playerVars,
    events: {
      onReady: () => {
        ytReady = true;
        try{ ytPlayer.unMute(); ytPlayer.setVolume(100); } catch(err){ console.warn('[yt] could not unmute on ready:', err); }
        console.log('[yt] player ready');
      },
      onStateChange: onPlayerStateChange,
      onError: onPlayerError,
    }
  });

  // Safety net: if onReady never fires within 4s (can happen on some
  // browser/extension combos), force-check the player state directly.
  setTimeout(() => {
    if(!ytReady && ytPlayer && typeof ytPlayer.getPlayerState === 'function'){
      try{
        ytPlayer.getPlayerState(); // throws if internal iframe isn't actually ready
        ytReady = true;
        console.warn('[yt] onReady never fired, but player responds — forcing ytReady=true');
      } catch(err){
        console.error('[yt] player still not responding after 4s:', err);
      }
    }
  }, 4000);
}

const YT_ERROR_MESSAGES = {
  2: 'ID de video inv\u00e1lido.',
  5: 'Error de reproducci\u00f3n HTML5 (problema del reproductor).',
  100: 'Video no encontrado, privado o eliminado.',
  101: 'El due\u00f1o del video no permite reproducirlo en reproductores externos (embed deshabilitado).',
  150: 'El due\u00f1o del video no permite reproducirlo en reproductores externos (embed deshabilitado).',
  153: 'YouTube rechaz\u00f3 la reproducci\u00f3n por el origen de la p\u00e1gina (t\u00edpico al abrir el archivo con file://). Necesita servirse por http/https.',
};

function onPlayerError(e){
  const msg = YT_ERROR_MESSAGES[e.data] || `Error desconocido (c\u00f3digo ${e.data}).`;
  console.error('[yt] playback error:', e.data, '\u2192', msg);
  hudTitle.textContent = `\u26a0 ${msg}`;
  hudArtist.textContent = '';
  if(e.data === 100 || e.data === 101 || e.data === 150){
    // this video specifically can't be embedded/played — skip just this one
    setTimeout(() => playNext(), 1500);
  }
  // error 153 is a page-origin rejection: it will affect every video the
  // same way while running from file://, so auto-skipping would just loop
  // through the whole queue failing silently. Leave it visible instead.
}

const YT_STATE_NAMES = { '-1':'UNSTARTED', 0:'ENDED', 1:'PLAYING', 2:'PAUSED', 3:'BUFFERING', 5:'CUED' };

function onPlayerStateChange(e){
  console.log('[yt] state change:', YT_STATE_NAMES[e.data] ?? e.data);
  if(e.data === YT.PlayerState.PLAYING){
    isPlaying = true;
    updatePlayPauseIcon();
    startProgressTracking();
  } else if(e.data === YT.PlayerState.PAUSED){
    isPlaying = false;
    updatePlayPauseIcon();
  } else if(e.data === YT.PlayerState.ENDED){
    isPlaying = false;
    updatePlayPauseIcon();
    playNext();
  } else if(e.data === YT.PlayerState.BUFFERING){
    // keep icon as "playing" while it buffers, since it will resume automatically
    isPlaying = true;
    updatePlayPauseIcon();
  } else if(e.data === YT.PlayerState.UNSTARTED || e.data === YT.PlayerState.CUED){
    // sometimes fires right after loadVideoById; ensure unmuted + volume set
    try{ ytPlayer.unMute(); ytPlayer.setVolume(100); } catch(err){}
  }
}

function updatePlayPauseIcon(){
  iconPlay.style.display = isPlaying ? 'none' : 'block';
  iconPause.style.display = isPlaying ? 'block' : 'none';
}

function updateHudInfo(item){
  if(!item){
    hudTitle.textContent = 'Sin reproducir';
    hudArtist.textContent = '';
    return;
  }
  hudTitle.textContent = item.titleGuess || item.title;
  hudArtist.textContent = item.artistGuess || item.author || '';
}

function startPlaying(item){
  if(!item || !ytReady) { if(!ytReady) setTimeout(() => startPlaying(item), 400); return; }
  queueState.nowPlaying = item;
  ytPlayer.loadVideoById({ videoId: item.videoId });
  // unmute/volume must be (re)applied after load, some browsers reset it
  setTimeout(() => {
    try{ ytPlayer.unMute(); ytPlayer.setVolume(100); ytPlayer.playVideo(); }
    catch(err){ console.error('[yt] failed to start playback:', err); }
  }, 60);
  updateHudInfo(item);
  renderQueue();
  persistQueueState();
  loadLyricsFor(item);
  maybeChangeBackgroundOnSongChange();
}

function playNext(){
  // current song (if any) is done being "now playing" — it graduates to history
  if(queueState.nowPlaying) pushToHistory(queueState.nowPlaying);
  const next = queueState.upcoming.shift();
  queueState.nowPlaying = null;
  if(next){
    startPlaying(next);
  } else {
    stopPlayback();
    persistQueueState();
  }
}
function playPrev(){
  // "previous" means: put current back at the front of upcoming, and
  // resume whatever was last in history.
  const last = queueState.history.pop();
  if(!last){ return; } // nothing to go back to
  if(queueState.nowPlaying) queueState.upcoming.unshift(queueState.nowPlaying);
  queueState.nowPlaying = null;
  startPlaying(last);
}
function togglePlayPause(){
  console.log('[yt] toggle clicked. ytReady=', ytReady, 'nowPlaying=', queueState.nowPlaying?.title, 'ytPlayer=', !!ytPlayer);
  if(!ytReady || !ytPlayer){
    console.warn('[yt] player not ready yet, ignoring click');
    hudTitle.textContent = '\u23f3 Cargando reproductor\u2026';
    hudArtist.textContent = '';
    return;
  }
  if(!queueState.nowPlaying){
    if(queueState.upcoming.length) playNext();
    else console.warn('[yt] queue is empty, nothing to play');
    return;
  }
  // Ask the player itself, don't trust the isPlaying flag alone —
  // avoids desync if a state-change event was missed.
  let state;
  try{ state = ytPlayer.getPlayerState(); } catch(err){ console.error('[yt] getPlayerState failed:', err); return; }
  console.log('[yt] real player state before toggle:', state);
  const isActuallyPlaying = (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING);
  if(isActuallyPlaying){
    ytPlayer.pauseVideo();
  } else {
    try{ ytPlayer.unMute(); ytPlayer.setVolume(100); } catch(err){}
    ytPlayer.playVideo();
  }
}
function stopPlayback(){
  if(ytPlayer && ytReady) ytPlayer.stopVideo();
  isPlaying = false;
  updatePlayPauseIcon();
  updateHudInfo(null);
  hudTime.textContent = '00:00 / 00:00';
  setPerimeterProgress(0);
  clearLyrics();
}

prevBtn.addEventListener('click', playPrev);
nextBtn.addEventListener('click', playNext);
playPauseBtn.addEventListener('click', togglePlayPause);

let showRemainingTime = false;

function formatTime(seconds){
  if(!isFinite(seconds) || seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

hudTime.addEventListener('click', () => {
  showRemainingTime = !showRemainingTime;
});

function startProgressTracking(){
  clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if(!ytPlayer || !ytReady) return;
    const dur = ytPlayer.getDuration();
    const cur = ytPlayer.getCurrentTime();
    if(dur > 0) animateProgressTo(cur / dur, 320);
    if(dur > 0){
      const left = showRemainingTime ? `-${formatTime(dur - cur)}` : formatTime(cur);
      hudTime.textContent = `${left} / ${formatTime(dur)}`;
    }
    updateLyricsHighlight(cur);
  }, 300);
}

/* ---------------------------------------------------------
   8. Lyrics engine (lrclib.net, synced when available)
--------------------------------------------------------- */
const lyricsState = {
  enabled: false,
  synced: null,   // [{time, text}]
  plain: null,    // string
  currentLineIdx: -1,
  delaySeconds: 0, // positive = show lyrics earlier, negative = show later
};

function clearLyrics(){
  lyricsState.synced = null;
  lyricsState.plain = null;
  lyricsState.currentLineIdx = -1;
  lyricsBox.innerHTML = '';
}

async function loadLyricsFor(item){
  clearLyrics();
  if(!lyricsState.enabled) return;
  renderLyricsStatus('Buscando letra\u2026');
  try{
    const artist = encodeURIComponent(item.artistGuess || '');
    const track = encodeURIComponent(item.titleGuess || item.title);
    const url = `${window.APP_CONFIG.LRCLIB_BASE}/search?track_name=${track}&artist_name=${artist}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('lrclib error');
    const results = await res.json();
    if(!results || !results.length){ renderLyricsStatus('Sin letra disponible para esta canci\u00f3n.'); return; }
    const best = results.find(r => r.syncedLyrics) || results[0];
    if(best.syncedLyrics){
      lyricsState.synced = parseLRC(best.syncedLyrics);
      renderSyncedLyricsShell();
    } else if(best.plainLyrics){
      lyricsState.plain = best.plainLyrics;
      renderPlainLyrics();
    } else {
      renderLyricsStatus('Sin letra disponible para esta canci\u00f3n.');
    }
  } catch(err){
    renderLyricsStatus('No se pudo obtener la letra (revis\u00e1 tu conexi\u00f3n).');
  }
}

function parseLRC(lrc){
  const lines = lrc.split('\n');
  const out = [];
  const timeRe = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\]/g;
  for(const line of lines){
    const matches = [...line.matchAll(timeRe)];
    if(!matches.length) continue;
    const text = line.replace(timeRe, '').trim();
    for(const m of matches){
      const min = parseInt(m[1]), sec = parseInt(m[2]), ms = parseInt((m[3]||'0').padEnd(3,'0'));
      out.push({ time: min*60 + sec + ms/1000, text });
    }
  }
  return out.sort((a,b) => a.time - b.time);
}

function renderLyricsStatus(msg){
  lyricsBox.innerHTML = `<div id="lyrics-status">${msg}</div>`;
}

function renderSyncedLyricsShell(){
  lyricsBox.innerHTML = '';
  lyricsBox.style.transform = 'translateY(0)';
  lyricsState.synced.forEach((l, i) => {
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.dataset.idx = i;
    div.textContent = l.text || '\u266a';
    lyricsBox.appendChild(div);
  });
  // position the very first line centered before playback starts moving it
  requestAnimationFrame(() => {
    const first = lyricsBox.querySelector('.lyric-line');
    if(first) lyricsBox.style.transform = `translateY(${-(first.offsetTop + first.offsetHeight/2)}px)`;
  });
}

function renderPlainLyrics(){
  lyricsBox.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'lyric-line current';
  div.style.whiteSpace = 'pre-line';
  div.style.fontSize = '20px';
  div.textContent = lyricsState.plain;
  lyricsBox.appendChild(div);
}

function updateLyricsHighlight(currentTime){
  if(!lyricsState.enabled || !lyricsState.synced) return;
  const effectiveTime = currentTime + lyricsState.delaySeconds;
  let idx = -1;
  for(let i = 0; i < lyricsState.synced.length; i++){
    if(lyricsState.synced[i].time <= effectiveTime) idx = i; else break;
  }
  if(idx === lyricsState.currentLineIdx) return;
  lyricsState.currentLineIdx = idx;
  const lines = lyricsBox.querySelectorAll('.lyric-line');
  lines.forEach((el, i) => {
    el.classList.remove('current', 'past');
    if(i === idx) el.classList.add('current');
    else if(i < idx) el.classList.add('past');
  });
  scrollLyricsToCurrentLine();
}

function scrollLyricsToCurrentLine(){
  // #lyrics-box is absolutely positioned with top:50% in CSS, so its own
  // natural position already centers line 0. We only need to shift it up
  // by the current line's offset (relative to the box) so that line sits
  // where line 0 used to be — i.e. vertically centered in the viewport.
  const activeEl = lyricsBox.querySelector('.lyric-line.current');
  if(!activeEl) return;
  const lineCenterOffset = activeEl.offsetTop + (activeEl.offsetHeight / 2);
  lyricsBox.style.transform = `translateY(${-lineCenterOffset}px)`;
}

btnLyrics.addEventListener('click', () => {
  lyricsState.enabled = !lyricsState.enabled;
  btnLyrics.classList.toggle('active', lyricsState.enabled);
  lyricsLayer.classList.toggle('visible', lyricsState.enabled);
  if(lyricsState.enabled && queueState.nowPlaying){
    loadLyricsFor(queueState.nowPlaying);
  } else {
    clearLyrics();
  }
});

/* Lyrics delay adjustment — hover panel with +/- 0.25s steps, no limit.
   Positive delay makes lyrics appear earlier (subtract from the song's
   real elapsed time isn't right conceptually — see updateLyricsHighlight:
   effectiveTime = currentTime + delaySeconds — so a positive value shows
   lines sooner, a negative value shows them later). */
const lyricsDelayValueEl = $('#lyrics-delay-value');
const LYRICS_DELAY_STEP = 0.25;

function updateLyricsDelayDisplay(){
  const d = lyricsState.delaySeconds;
  const sign = d > 0 ? '+' : '';
  lyricsDelayValueEl.textContent = `${sign}${d.toFixed(2)}s`;
}

$('#lyrics-delay-plus').addEventListener('click', (e) => {
  e.stopPropagation();
  lyricsState.delaySeconds = Math.round((lyricsState.delaySeconds + LYRICS_DELAY_STEP) * 100) / 100;
  updateLyricsDelayDisplay();
  forceLyricsRecalc();
});
$('#lyrics-delay-minus').addEventListener('click', (e) => {
  e.stopPropagation();
  lyricsState.delaySeconds = Math.round((lyricsState.delaySeconds - LYRICS_DELAY_STEP) * 100) / 100;
  updateLyricsDelayDisplay();
  forceLyricsRecalc();
});

function forceLyricsRecalc(){
  // the delay just changed: re-evaluate the current line immediately
  // instead of waiting for the next 300ms progress tick, so the
  // adjustment feels instant.
  if(!ytPlayer || !ytReady || !lyricsState.enabled) return;
  try{
    const cur = ytPlayer.getCurrentTime();
    lyricsState.currentLineIdx = -2; // force a mismatch so the highlight function doesn't early-return
    updateLyricsHighlight(cur);
  } catch(err){ /* player not ready, ignore */ }
}

/* ---------------------------------------------------------
   9. Add song wiring
--------------------------------------------------------- */
addSongBtn.addEventListener('click', () => {
  const val = ytUrlInput.value.trim();
  if(val) addSongToQueue(val);
});
ytUrlInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); addSongBtn.click(); }
});

/* ---------------------------------------------------------
   10. Boot
--------------------------------------------------------- */
async function boot(){
  resizePerimeter();
  await Promise.all([loadBackgroundsFromDB(), loadQueueFromDB()]);
  await initYTPlayer();
  // briefly reveal navbar on load so the user knows it exists
  showNav();
  scheduleHide(2600);
}

boot();

})();
</script>
