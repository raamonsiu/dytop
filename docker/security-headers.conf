# Included, not inherited.
#
# nginx drops every add_header inherited from an outer block as soon as the
# current block declares one of its own. The asset and index.html locations
# below both set Cache-Control, which silently stripped all of these from every
# response that mattered. Including the file in each block is the fix.

# Same four headers as the D1ITO portfolio's next.config.ts.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# A copied-from-elsewhere CSP would break this app outright, so every source
# here is one it actually needs:
#   frame-src   the YouTube embed, which *is* the player
#   connect-src lrclib (lyrics) and youtube.com (oEmbed metadata)
#   img-src     ytimg thumbnails, plus blob: for uploaded backgrounds
#   media-src   blob: for uploaded background video
#   script-src  'unsafe-inline' is required by the IFrame API's own bootstrap
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://*.ytimg.com; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://lrclib.net https://www.youtube.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; base-uri 'self'; form-action 'self'" always;
