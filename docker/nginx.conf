# Rendered by the nginx image's entrypoint (envsubst over /etc/nginx/templates),
# which only substitutes variables that exist in the environment, so nginx's own
# $variables below pass through untouched. See the Dockerfile.

# Per-client budget for the search proxy. Typing is debounced client-side to at
# most a few requests a second; this only stops the proxy being used as a free
# YouTube scraper.
limit_req_zone $binary_remote_addr zone=yt_search:1m rate=5r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/security-headers.conf;

  # Hashed filenames, so they can never go stale.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # nginx's stock mime.types has no entry for this extension, so it would
  # otherwise fall back to application/octet-stream and some browsers refuse
  # to treat the manifest as installable.
  location = /manifest.webmanifest {
    include /etc/nginx/security-headers.conf;
    default_type application/manifest+json;
  }

  # Search. There is no keyless public search API, so this forwards to YouTube's
  # internal InnerTube endpoint, the one youtube.com itself calls. It sends no
  # CORS headers, which is why the browser can't reach it directly.
  #
  # The upstream goes through a variable so it's resolved per request: a
  # hostname written straight into proxy_pass is resolved at startup, and an
  # nginx started without DNS would refuse to serve the rest of the app too.
  location = /api/youtube/search {
    include /etc/nginx/security-headers.conf;

    limit_except POST { deny all; }
    limit_req zone=yt_search burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    resolver_timeout 5s;
    set $yt_origin https://www.youtube.com;
    proxy_pass $yt_origin/youtubei/v1/search?prettyPrint=false;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    # Nothing about the listener goes upstream: no cookies, no page origin, no
    # client address. YouTube sees an anonymous request from this server.
    proxy_set_header Host www.youtube.com;
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";

    # Nor does anything YouTube sets for its own pages come back as if it
    # were ours.
    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Report-To;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    add_header Cache-Control "no-store" always;
  }

  # SPA fallback: /legacy and /history are client-side routes with no file
  # behind them, and must return the shell rather than a 404.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # The entry point must never be cached, or a deploy keeps serving the old
  # asset hashes. try_files above lands here internally, so the headers have to
  # be repeated once more.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
